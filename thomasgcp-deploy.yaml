imports:
- path: myproject-webserver.jinja
- path: myproject-network.jinja

resources:
#Create myproject-instance
- name: myproject-webserver
  type: myproject-webserver.jinja
  properties:
    zone: us-east1-b
    machineType: f1-micro
    network: $(ref.myproject-network.selfLink)

#Create myproject-network
- name: myproject-network
  type: myproject-network.jinja
  properties:
    region: us-east1
